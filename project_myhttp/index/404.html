<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f6f8fa;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .code {
            font-size: 120px;
            font-weight: 700;
            color: #2563eb;
            line-height: 1;
        }
        .title {
            font-size: 24px;
            margin: 16px 0 8px;
        }
        .desc {
            color: #666;
            margin-bottom: 32px;
        }
        a {
            display: inline-block;
            padding: 12px 28px;
            background-color: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h2 class="title">哎呀，页面走丢了</h2>
        <p class="desc">你访问的地址不存在或者已经被移除</p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
